name: orient
description: "A remote client for qBittorrent WebUI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.5.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon-1024.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon-1024.png
  remove_alpha_ios: true
